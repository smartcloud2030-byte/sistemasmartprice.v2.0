name: Deploy SmartPrice → VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy na VPS (produção)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          # Padrão da action é 10m — já estourou duas vezes com o build do
          # Docker sozinho (npm ci, vite build, pip install do rembg etc.)
          # levando mais que isso quando a VPS está sob carga.
          command_timeout: 30m
          script: |
            set -e
            echo "=== Iniciando deploy SmartPrice ==="

            # Cada passo passa por `passo`: se falhar, imprime um `::error::`
            # com o comando e a saída — o GitHub vira isso em anotação, que
            # aparece no `gh run view` mesmo pra quem não é admin do repo (o
            # log completo só admin vê, e o deploy ficou quebrado dias sem
            # ninguém conseguir ler o erro).
            passo() {
              echo "--- $*"
              if ! saida=$("$@" 2>&1); then
                echo "$saida"
                echo "::error title=Deploy falhou::$* -> $(echo "$saida" | grep -v 'variable is not set' | tail -3 | tr '\n' ' ')"
                exit 1
              fi
              echo "$saida" | grep -v 'variable is not set' | tail -20
            }

            cd /var/www/smartprice

            # A VPS é só um alvo de deploy — sempre reflete exatamente o que
            # está no GitHub. Qualquer edição feita direto na VPS (fora do
            # git) é descartada aqui, pra um "git pull" nunca mais falhar
            # silenciosamente por causa de mudança local e deixar o deploy
            # rodando com código antigo em cache.
            passo git fetch origin main
            passo git reset --hard origin/main

            # Atualiza as imagens de fora (postgres, minio). Registro fora do
            # ar/rate limit não pode travar o deploy: sem a imagem nova, sobe
            # com a que já está na VPS.
            passo docker compose pull --ignore-pull-failures

            # Rebuild e restart sem downtime
            passo docker compose up -d --build --remove-orphans

            # Limpar imagens antigas do Docker
            docker image prune -f || true

            echo "=== Deploy concluído! ==="
            git log --oneline -1
            docker compose ps

  deploy-standby:
    name: Deploy na VPS (standby)
    runs-on: ubuntu-latest
    # Job independente do deploy de produção — se a standby falhar (ex.: fora
    # do ar), nao trava nem cancela o deploy da producao, que e o que importa.
    continue-on-error: true

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS2_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            echo "=== Iniciando deploy SmartPrice (standby) ==="

            cd /var/www/smartprice

            git fetch origin main
            git reset --hard origin/main

            docker compose pull
            docker compose up -d --build --remove-orphans

            docker image prune -f

            echo "=== Deploy concluído (standby)! ==="
            docker compose ps
