<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>smartprice</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Rede de segurança contra "tela branca": se o sistema não conseguir abrir
      (arquivo que sumiu depois de um deploy, erro de JavaScript, dados do
      navegador corrompidos), mostra o erro na tela com botões pra recarregar
      ou limpar os dados deste navegador — em vez de deixar tudo em branco.
      JS "antigo" de propósito (roda antes do sistema, em qualquer Chrome).
    -->
    <script>
      (function () {
        var erros = [];
        var root = document.getElementById('root');
        var CHAVE_RELOAD = 'sp-recarregou-apos-erro';

        function vazio() { return !root || root.childNodes.length === 0; }

        function mostrar() {
          if (!vazio() || document.getElementById('sp-falha')) return;
          var msg = erros.length ? erros.join('\n') : 'O sistema demorou demais pra abrir.';
          var div = document.createElement('div');
          div.id = 'sp-falha';
          div.style.cssText = 'font-family:Arial,sans-serif;max-width:560px;margin:60px auto;padding:24px;border:1px solid #ddd;border-radius:12px;color:#222;background:#fff';
          div.innerHTML =
            '<h2 style="margin:0 0 8px">O SmartPrice não abriu neste navegador</h2>' +
            '<p style="margin:0 0 16px;color:#555">Tente recarregar. Se continuar, use "Limpar dados e recarregar" (apaga só o que ficou salvo neste navegador, como a fila de impressão; seus dados no servidor não são afetados).</p>' +
            '<button id="sp-recarregar" style="padding:10px 16px;margin-right:8px;border:0;border-radius:8px;background:#059669;color:#fff;font-weight:bold;cursor:pointer">Recarregar</button>' +
            '<button id="sp-limpar" style="padding:10px 16px;border:1px solid #ccc;border-radius:8px;background:#fff;font-weight:bold;cursor:pointer">Limpar dados e recarregar</button>' +
            '<p style="margin:20px 0 4px;font-size:12px;color:#888">Detalhe do erro (mande um print pro suporte):</p>' +
            '<pre style="white-space:pre-wrap;font-size:12px;background:#f5f5f5;padding:10px;border-radius:8px;color:#b91c1c"></pre>';
          div.getElementsByTagName('pre')[0].textContent = msg + '\n\n' + navigator.userAgent;
          document.body.appendChild(div);
          document.getElementById('sp-recarregar').onclick = function () { location.reload(); };
          document.getElementById('sp-limpar').onclick = function () {
            try { localStorage.clear(); } catch (e) {}
            try { sessionStorage.clear(); } catch (e) {}
            location.reload();
          };
        }

        window.addEventListener('error', function (e) {
          var alvo = e.target;
          if (alvo && (alvo.tagName === 'SCRIPT' || alvo.tagName === 'LINK')) {
            // Arquivo do sistema não carregou — quase sempre página antiga em
            // cache depois de um deploy. Recarrega sozinho UMA vez.
            erros.push('Falha ao carregar ' + (alvo.src || alvo.href));
            var jaRecarregou = false;
            try { jaRecarregou = sessionStorage.getItem(CHAVE_RELOAD) === '1'; } catch (err) {}
            if (!jaRecarregou) {
              try { sessionStorage.setItem(CHAVE_RELOAD, '1'); } catch (err) {}
              location.reload();
              return;
            }
          } else {
            erros.push((e.message || 'Erro') + (e.filename ? ' (' + e.filename + ':' + e.lineno + ')' : ''));
          }
          setTimeout(mostrar, 1500);
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          var txt = (r && (r.stack || r.message)) || String(r);
          if (txt.indexOf('WebSocket') !== -1 || txt.indexOf('[vite]') !== -1) return;
          erros.push('Promise: ' + txt);
          setTimeout(mostrar, 1500);
        });

        // Abriu direito: libera o "recarregar sozinho" pra um próximo deploy.
        setTimeout(function () {
          if (!vazio()) { try { sessionStorage.removeItem(CHAVE_RELOAD); } catch (e) {} }
        }, 5000);
        // Nada apareceu em 15s, mesmo sem erro registrado → mostra a tela de ajuda.
        setTimeout(mostrar, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
